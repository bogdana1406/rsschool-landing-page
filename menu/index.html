<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      name="description"
      content="Explore the Coffee House menu of coffee, tea, and desserts."
    >
    <title>Menu | Coffee House</title>
    <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../styles/base.css">
    <link rel="stylesheet" href="../styles/menu.css">
    <link rel="stylesheet" href="../styles/responsive.css">
    <script src="../scripts/theme.js" defer></script>
  </head>
  <body class="page page--menu">
    <header class="header">
      <div class="header__inner container">
        <a class="logo" href="../" aria-label="Coffee House home page">
          <span class="logo__wordmark">Resource</span>
          <span class="logo__caption">Coffee House</span>
        </a>

        <nav class="header__nav" id="site-navigation" aria-label="Primary navigation">
          <ul class="header__nav-list">
            <li><a class="header__nav-link" href="../#favorite-coffee">Favorite coffee</a></li>
            <li><a class="header__nav-link" href="../#about">About</a></li>
            <li><a class="header__nav-link" href="../#mobile-app">Mobile app</a></li>
            <li><a class="header__nav-link" href="#contacts">Contact us</a></li>
          </ul>
        </nav>

        <div class="header__actions">
          <button
            class="theme-toggle"
            type="button"
            aria-label="Switch to dark theme"
            aria-pressed="false"
          >
            <span class="theme-toggle__option theme-toggle__option--light" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20">
                <circle cx="12" cy="12" r="4"></circle>
                <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"></path>
              </svg>
            </span>
            <span class="theme-toggle__option theme-toggle__option--dark" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20">
                <path d="M20.2 15.2A8.5 8.5 0 0 1 8.8 3.8a8.5 8.5 0 1 0 11.4 11.4Z"></path>
              </svg>
            </span>
          </button>

          <a class="header__menu-link header__menu-link--active" href="./" aria-current="page">
            <span>Menu</span>
            <svg aria-hidden="true" viewBox="0 0 20 20" width="20" height="20">
              <path d="M3 3h11v7a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5V3Z"></path>
              <path d="M14 6h1.5a2.5 2.5 0 0 1 0 5H14M6 18h7"></path>
            </svg>
          </a>

          <button
            class="burger"
            type="button"
            aria-label="Open menu"
            aria-expanded="false"
            aria-controls="site-navigation"
          >
            <span></span>
            <span></span>
          </button>
        </div>
      </div>
    </header>

    <main class="main" id="main-content">
      <div class="container">
        <h1>Coffee House menu</h1>
        <p>The catalog layout will be added in a later development stage.</p>
        <a href="../">Return to the home page</a>
      </div>
    </main>
  </body>
</html>
